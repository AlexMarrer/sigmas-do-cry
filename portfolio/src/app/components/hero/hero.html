<section class="hero">
  <h1 class="visually-hidden">Alex Uscata — Application Developer, Basel</h1>

  <div class="hero__marquee">
    <!-- ⚠ the track animates to -50% of ITS OWN width, so the two groups must
         stay byte-for-byte identical — edit one, edit both, or the loop jumps. -->
    <div class="hero__track">
      <div class="hero__group">
        <span>Alex Uscata · Trainee</span>
        <span class="hero__dash">—</span>
        <span>Alex Uscata · Trainee</span>
        <span class="hero__dash">—</span>
        <span>Alex Uscata · Trainee</span>
        <span class="hero__dash">—</span>
      </div>

      <div class="hero__group" aria-hidden="true">
        <span>Alex Uscata · Trainee</span>
        <span class="hero__dash">—</span>
        <span>Alex Uscata · Trainee</span>
        <span class="hero__dash">—</span>
        <span>Alex Uscata · Trainee</span>
        <span class="hero__dash">—</span>
      </div>
    </div>
  </div>

  <!-- ⚠ F1: LCP — `priority` emits the preload, `sizes` must match the CSS width.
       ⚠ F2: TODO swap the 318 KB PNG for AVIF/WebP-with-alpha. -->
  <img
    class="hero__portrait"
    ngSrc="/images/hero-cutout.png"
    priority
    width="1537"
    height="1023"
    sizes="(max-width: 768px) 94vw, 67vw"
    alt="Portrait of Alex Uscata" />

  <div class="hero__bar">
    <span class="hero__pill theme-dark" appMagnetic>
      <span class="hero__dot" aria-hidden="true"></span>
      Based in Switzerland
    </span>

    <div class="hero__meta">
      <div class="hero__meta-title">↳ Application Developer</div>
      <div class="hero__meta-label">Web · App · Backend</div>
    </div>
  </div>
</section>
